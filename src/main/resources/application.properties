spring.application.name=clario

# ===== Database (MySQL) =====
# Update these to match your local MySQL instance, or set the equivalent
# environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) instead of editing this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clario_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:aryan123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# ===== SQL seed data =====
# data.sql runs after Hibernate creates/updates the schema (see defer-datasource-initialization above).
# It uses INSERT IGNORE / ON DUPLICATE style guards so it is safe to restart the app repeatedly.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== Server =====
server.port=8080

# ===== Session =====
server.servlet.session.timeout=8h

logging.level.org.springframework.security=INFO
