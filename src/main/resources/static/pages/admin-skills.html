<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — Clario Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sw-app-shell" id="swShellRoot"></div>

  <template id="tpl-admin-skills">
    <div class="sw-page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h2>Skills</h2>
        <p>Manage the master skill catalog available to every user.</p>
      </div>
      <button class="btn btn-primary" id="addSkillBtn"><i class="fa-solid fa-plus me-1"></i> Add Skill</button>
    </div>

    <div class="sw-card">
      <div class="table-responsive">
        <table class="sw-table">
          <thead><tr><th>Skill</th><th>Category</th><th></th></tr></thead>
          <tbody id="skillsTableBody"></tbody>
        </table>
      </div>
    </div>
  </template>

  <div class="modal fade" id="skillModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="skillModalTitle">Add Skill</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="skillForm">
          <div class="modal-body">
            <input type="hidden" id="skillId">
            <div class="mb-3">
              <label class="form-label">Skill Name</label>
              <input type="text" class="form-control" id="skillName" required>
            </div>
            <div class="mb-1">
              <label class="form-label">Category</label>
              <select class="form-select" id="skillCategory" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Skill</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/admin-skills.js"></script>
</body>
</html>
