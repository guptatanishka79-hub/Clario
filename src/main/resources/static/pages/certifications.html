<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certifications — Clario</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sw-app-shell" id="swShellRoot"></div>

  <template id="tpl-certs">
    <div class="sw-page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h2>Certifications</h2>
        <p>Keep every credential, issuer, and expiry date in one place.</p>
      </div>
      <button class="btn btn-primary" id="addCertBtn"><i class="fa-solid fa-plus me-1"></i> Add Certification</button>
    </div>
    <div class="row g-3" id="certsGrid"></div>
    <div id="certsEmpty" class="sw-card d-none">
      <div class="sw-empty-state py-5">
        <i class="fa-solid fa-certificate"></i>
        <h6>No certifications yet</h6>
        <p class="mb-3" style="font-size:13.5px;">Add your first certification to showcase your credentials.</p>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('addCertBtn').click()">Add Certification</button>
      </div>
    </div>
  </template>

  <div class="modal fade" id="certModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="certModalTitle">Add Certification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="certForm">
          <div class="modal-body">
            <input type="hidden" id="certId">
            <div class="mb-3">
              <label class="form-label">Certification Name</label>
              <input type="text" class="form-control" id="certName" required placeholder="e.g. AWS Certified Solutions Architect">
            </div>
            <div class="mb-3">
              <label class="form-label">Issuing Organization</label>
              <input type="text" class="form-control" id="certOrg" placeholder="e.g. Amazon Web Services">
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Issue Date</label>
                <input type="date" class="form-control" id="certIssueDate">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Expiry Date</label>
                <input type="date" class="form-control" id="certExpiryDate">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Credential ID</label>
              <input type="text" class="form-control" id="certCredentialId">
            </div>
            <div class="mb-1">
              <label class="form-label">Credential URL</label>
              <input type="url" class="form-control" id="certCredentialUrl" placeholder="https://...">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Certification</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/certifications.js"></script>
</body>
</html>
