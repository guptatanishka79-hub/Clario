<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills — Clario</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sw-app-shell" id="swShellRoot"></div>

  <template id="tpl-skills">
    <div class="sw-page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h2>My Skills</h2>
        <p>Track every skill you have, with proficiency and experience.</p>
      </div>
      <button class="btn btn-primary" id="addSkillBtn"><i class="fa-solid fa-plus me-1"></i> Add Skill</button>
    </div>

    <div class="sw-card mb-3">
      <div class="sw-card-body d-flex gap-2 flex-wrap align-items-center">
        <div class="sw-input-icon-wrap" style="max-width: 280px;">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="form-control" id="searchInput" placeholder="Search skills...">
        </div>
        <select class="form-select" id="categoryFilter" style="max-width: 220px;">
          <option value="">All Categories</option>
        </select>
      </div>
    </div>

    <div class="sw-card">
      <div class="table-responsive">
        <table class="sw-table">
          <thead>
            <tr>
              <th>Skill</th>
              <th>Category</th>
              <th>Proficiency</th>
              <th>Experience</th>
              <th>Last Updated</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="skillsTableBody"></tbody>
        </table>
      </div>
      <div id="skillsEmpty" class="sw-empty-state d-none">
        <i class="fa-solid fa-layer-group"></i>
        <h6>No skills yet</h6>
        <p class="mb-3" style="font-size: 13.5px;">Add your first skill to start building your profile.</p>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('addSkillBtn').click()">Add Skill</button>
      </div>
    </div>
  </template>

  <!-- Add/Edit Skill Modal -->
  <div class="modal fade" id="skillModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="skillModalTitle">Add Skill</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="skillForm">
          <div class="modal-body">
            <input type="hidden" id="skillEntryId">
            <div class="mb-3" id="skillNameFieldWrap">
              <label class="form-label">Skill</label>
              <input type="text" class="form-control" id="skillNameInput" list="skillCatalogList" placeholder="e.g. Java, Docker, Communication" required>
              <datalist id="skillCatalogList"></datalist>
              <div class="form-text">Pick an existing skill or type a new one.</div>
            </div>
            <div class="mb-3" id="categoryFieldWrap">
              <label class="form-label">Category (only needed for a brand-new skill)</label>
              <select class="form-select" id="skillCategoryInput">
                <option value="">Select category</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Proficiency Level</label>
              <select class="form-select" id="proficiencyInput" required>
                <option value="BEGINNER">Beginner</option>
                <option value="INTERMEDIATE">Intermediate</option>
                <option value="ADVANCED">Advanced</option>
                <option value="EXPERT">Expert</option>
              </select>
            </div>
            <div class="mb-1">
              <label class="form-label">Years of Experience</label>
              <input type="number" step="0.5" min="0" max="60" class="form-control" id="yearsInput" placeholder="e.g. 2.5">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="skillFormSubmit">Save Skill</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/skills.js"></script>
</body>
</html>
