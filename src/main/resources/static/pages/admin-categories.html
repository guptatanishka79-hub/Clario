<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Clario Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sw-app-shell" id="swShellRoot"></div>

  <template id="tpl-admin-categories">
    <div class="sw-page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h2>Skill Categories</h2>
        <p>Organize skills into groups such as Programming Languages or DevOps.</p>
      </div>
      <button class="btn btn-primary" id="addCategoryBtn"><i class="fa-solid fa-plus me-1"></i> Add Category</button>
    </div>

    <div class="row g-3" id="categoriesGrid"></div>
  </template>

  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="categoryForm">
          <div class="modal-body">
            <label class="form-label">Category Name</label>
            <input type="text" class="form-control" id="categoryName" required placeholder="e.g. Data Science">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/admin-categories.js"></script>
</body>
</html>
